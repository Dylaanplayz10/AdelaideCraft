
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdelaideCraft 2050</title>
<style>
body { margin: 0; overflow: hidden; font-family: Arial; }
canvas { display: block; }
#hud {
  position: fixed; top: 12px; left: 12px;
  color: white; background: #10243acc;
  padding: 14px; border-radius: 10px;
  line-height: 1.7; pointer-events: none;
}
#start {
  position: fixed; inset: 0; display: flex;
  align-items: center; justify-content: center;
  background: #071525bb; color: white;
  text-align: center; cursor: pointer;
}
#panel {
  background: #122c44; padding: 25px;
  border-radius: 15px; margin: 20px;
}
button {
  padding: 14px 25px; font-size: 17px;
  font-weight: bold; cursor: pointer;
  border: 0; border-radius: 8px;
}
#crosshair {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  color: white; font-size: 24px;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="hud">
  <b>🏙️ ADELAIDECRAFT 2050</b><br>
  WASD: Move<br>
  Mouse: Look around<br>
  SHIFT: Run faster<br>
  SPACE: Jump / fly up<br>
  CTRL: Fly down<br>
  ESC: Release mouse
</div>

<div id="crosshair">+</div>

<div id="start">
  <div id="panel">
    <h1>AdelaideCraft 2050</h1>
    <p>Explore the future city of Adelaide!</p>
    <p>WASD to move • Mouse to look</p>
    <button id="play">ENTER CITY</button>
    <p id="status">Ready to explore?</p>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 180, 650);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 1000
);
camera.position.set(0, 2, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x596b49, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(-50, 100, 40);
sun.castShadow = true;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1200, 1200),
  new THREE.MeshStandardMaterial({ color: 0x419447 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Roads
function makeRoad(x, z, w, d) {
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({ color: 0x30343b })
  );
  road.rotation.x = -Math.PI / 2;
  road.position.set(x, 0.04, z);
  scene.add(road);
}

makeRoad(0, 0, 16, 500);
makeRoad(0, 0, 500, 16);

const yellow = new THREE.MeshBasicMaterial({ color: 0xffe7a0 });

for (let z = -240; z < 250; z += 12) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.25, 5), yellow
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.07, z);
  scene.add(line);
}

// Building materials
const colors = [
  0x8296a8, 0x537b99, 0xb5c5d5,
  0x657783, 0x719ca5, 0x8e9ba8
];

const materials = colors.map(c =>
  new THREE.MeshStandardMaterial({
    color: c, metalness: 0.35, roughness: 0.4
  })
);

const glass = new THREE.MeshStandardMaterial({
  color: 0x77d9f5,
  emissive: 0x12394b,
  metalness: 0.45,
  roughness: 0.25
});

// Create buildings with windows
function makeBuilding(x, z, w, d, h, id) {
  const building = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    materials[id % materials.length]
  );

  building.position.set(x, h / 2, z);
  building.castShadow = true;
  building.receiveShadow = true;
  scene.add(building);

  const windowGeo = new THREE.BoxGeometry(
    Math.min(1.2, w / 5), 1.15, 0.07
  );

  const cols = Math.max(2, Math.floor(w / 2.4));
  const floors = Math.floor(h / 3.2);

  for (let f = 1; f < floors; f++) {
    for (let c = 0; c < cols; c++) {
      const wx = x - w / 2 + (c + 0.5) * w / cols;
      const wy = f * 3.2;

      for (const side of [-1, 1]) {
        const win = new THREE.Mesh(windowGeo, glass);
        win.position.set(wx, wy, z + side * (d / 2 + 0.04));
        scene.add(win);
      }
    }
  }

  // Rooftop
  if (h > 35) {
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.4, 2, d * 0.4),
      materials[3]
    );
    roof.position.set(x, h + 1, z);
    scene.add(roof);
  }
}

// Repeatable random city layout
let seed = 2050;
function random() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

let id = 0;

for (let x = -110; x <= 110; x += 22) {
  for (let z = -110; z <= 110; z += 22) {
    if (Math.abs(x) < 17 || Math.abs(z) < 17) continue;

    const w = 10 + random() * 6;
    const d = 10 + random() * 6;
    const h = 18 + random() * 75;

    makeBuilding(x, z, w, d, h, id++);
  }
}

// Player controls
const keys = {};
let yaw = 0;
let pitch = 0;
const start = document.getElementById('start');
const status = document.getElementById('status');

document.getElementById('play').addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  const playing =
    document.pointerLockElement === renderer.domElement;

  start.style.display = playing ? 'none' : 'flex';

  if (!playing) status.textContent = 'Click ENTER CITY to resume.';
});

document.addEventListener('pointerlockerror', () => {
  status.textContent = 'Mouse lock failed. Try again.';
});

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;

  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = THREE.MathUtils.clamp(pitch, -1.55, 1.55);
});

document.addEventListener('keydown', e => {
  keys[e.code] = true;

  if (['Space', 'ArrowUp', 'ArrowDown',
       'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    e.preventDefault();
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

const clock = new THREE.Clock();
const direction = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  if (document.pointerLockElement === renderer.domElement) {
    forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
    right.set(Math.cos(yaw), 0, -Math.sin(yaw));
    direction.set(0, 0, 0);

    if (keys.KeyW) direction.add(forward);
    if (keys.KeyS) direction.sub(forward);
    if (keys.KeyD) direction.add(right);
    if (keys.KeyA) direction.sub(right);

    if (direction.lengthSq() > 0) {
      direction.normalize();
      const speed = keys.ShiftLeft || keys.ShiftRight ? 32 : 16;
      camera.position.addScaledVector(direction, speed * dt);
    }

    if (keys.Space) camera.position.y += 12 * dt;
    if (keys.ControlLeft || keys.ControlRight) {
      camera.position.y -= 12 * dt;
    }

    camera.position.y = Math.max(1.5, camera.position.y);
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
