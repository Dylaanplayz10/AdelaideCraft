<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdelaideCraft 2050</title>
<style>
  body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 15px; left: 15px;
    color: white; background: #10243acc;
    padding: 14px; border-radius: 10px;
    line-height: 1.7; user-select: none;
  }
  #crosshair {
    position: fixed; left: 50%; top: 50%;
    color: white; font-size: 24px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #start {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: #07152599; color: white;
    text-align: center; cursor: pointer;
  }
  #panel {
    background: #122c44; padding: 28px;
    border-radius: 16px; max-width: 360px;
    margin: 20px;
  }
  button {
    padding: 12px 22px; border: 0;
    border-radius: 8px; cursor: pointer;
    font-size: 16px; font-weight: bold;
  }
</style>
</head>
<body>

<div id="hud">
  <strong>🏙️ AdelaideCraft 2050</strong><br>
  WASD: Move<br>
  Mouse: Look around<br>
  SPACE: Move up<br>
  SHIFT: Move faster<br>
  ESC: Release mouse
</div>

<div id="crosshair">+</div>

<div id="start">
  <div id="panel">
    <h1>AdelaideCraft 2050</h1>
    <p>Explore your future city in 3D!</p>
    <p>WASD to move and your mouse to look around.</p>
    <button id="play">ENTER CITY</button>
    <p id="status">Click ENTER CITY to begin.</p>
  </div>
</div>

<script type="module">
import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 500);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 1000
);
camera.position.set(0, 2, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x52664a, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(-40, 80, 30);
sun.castShadow = true;
scene.add(sun);

// Green ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ color: 0x439447 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Roads
function road(x, z, width, depth) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth),
    new THREE.MeshStandardMaterial({ color: 0x343941 })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0.025, z);
  scene.add(mesh);
}

road(0, 0, 14, 400);
road(0, 0, 400, 14);

// Road lane markings
const lineMaterial = new THREE.MeshBasicMaterial({
  color: 0xf4e9a4
});

for (let z = -190; z < 200; z += 12) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.25, 5),
    lineMaterial
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.06, z);
  scene.add(line);
}

const buildingMaterials = [
  0x899eae, 0x6889a2, 0xb5c4d1,
  0x64747f, 0x8f9ba8, 0x6c9da8
].map(color => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.4,
  metalness: 0.25
}));

const windowMaterial = new THREE.MeshStandardMaterial({
  color: 0x8ee5ff,
  emissive: 0x16445a,
  metalness: 0.4,
  roughness: 0.25
});

// Build the city
function building(x, z, w, d, h, index) {
  const material = buildingMaterials[
    index % buildingMaterials.length
  ];

  const tower = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material
  );
  tower.position.set(x, h / 2, z);
  tower.castShadow = true;
  tower.receiveShadow = true;
  scene.add(tower);

  // Windows on the front and back
  const floors = Math.floor(h / 3);
  const columns = Math.max(2, Math.floor(w / 2.5));

  for (let floor = 1; floor < floors; floor++) {
    for (let col = 0; col < columns; col++) {
      const wx = x - w / 2 + (col + 0.5) * w / columns;
      const wy = floor * 3;

      for (const side of [-1, 1]) {
        const windowMesh = new THREE.Mesh(
          new THREE.BoxGeometry(
            Math.min(1.1, w / columns * 0.55),
            1.1,
            0.06
          ),
          windowMaterial
        );
        windowMesh.position.set(
          wx, wy, z + side * (d / 2 + 0.04)
        );
        scene.add(windowMesh);
      }
    }
  }

  // Rooftop structure
  if (h > 30) {
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.35, 2, d * 0.35),
      buildingMaterials[3]
    );
    roof.position.set(x, h + 1, z);
    scene.add(roof);
  }
}

let seed = 2050;
function random() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

let index = 0;

for (let x = -55; x <= 55; x += 18) {
  for (let z = -65; z <= 65; z += 18) {
    // Keep the starting area and roads clear
    if (Math.abs(x) < 13 || Math.abs(z) < 13) continue;

    const w = 9 + random() * 5;
    const d = 9 + random() * 5;
    const h = 15 + random() * 65;

    building(x, z, w, d, h, index++);
  }
}

// Controls
let yaw = 0;
let pitch = 0;
const keys = {};
const playerSpeed = 18;
const startScreen = document.getElementById('start');
const status = document.getElementById('status');

document.getElementById('play').addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  const playing = document.pointerLockElement === renderer.domElement;
  startScreen.style.display = playing ? 'none' : 'flex';

  if (!playing) {
    status.textContent = 'Click ENTER CITY to continue.';
  }
});

document.addEventListener('pointerlockerror', () => {
  status.textContent =
    'Mouse lock failed. Try clicking ENTER CITY again.';
});

document.addEventListener('mousemove', event => {
  if (document.pointerLockElement !== renderer.domElement) return;

  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;
  pitch = THREE.MathUtils.clamp(
    pitch, -Math.PI / 2 + 0.01, Math.PI / 2 - 0.01
  );
});

document.addEventListener('keydown', event => {
  keys[event.code] = true;

  if ([
    'Space', 'ArrowUp', 'ArrowDown',
    'ArrowLeft', 'ArrowRight'
  ].includes(event.code)) {
    event.preventDefault();
  }
});

document.addEventListener('keyup', event => {
  keys[event.code] = false;
});

window.addEventListener('blur', () => {
  for (const key in keys) keys[key] = false;
});

const clock = new THREE.Clock();
const direction = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  if (document.pointerLockElement === renderer.domElement) {
    forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
    right.set(Math.cos(yaw), 0, -Math.sin(yaw));
    direction.set(0, 0, 0);

    if (keys.KeyW || keys.ArrowUp) direction.add(forward);
    if (keys.KeyS || keys.ArrowDown) direction.sub(forward);
    if (keys.KeyD || keys.ArrowRight) direction.add(right);
    if (keys.KeyA || keys.ArrowLeft) direction.sub(right);

    if (direction.lengthSq() > 0) {
      direction.normalize();
      const speed = playerSpeed * (keys.ShiftLeft ? 2 : 1);
      camera.position.addScaledVector(direction, speed * delta);
    }

    if (keys.Space) camera.position.y += 12 * delta;
    if (keys.ControlLeft) camera.position.y -= 12 * delta;

    camera.position.y = Math.max(1.5, camera.position.y);
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
